[package]
name = "quicktrans"
version = "0.1.0"
description = "划词翻译 (DeepSeek)"
authors = ["you"]
edition = "2021"

[lib]
name = "quicktrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 上透明窗口必需（否则浮窗渲染成不透明黑块）
# image-png：托盘 template 图用 Image::from_bytes 加载，该方法被 image-png/image-ico 门控
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls：避免在 Windows 上折腾 OpenSSL，macOS 上也省掉 Security.framework 的麻烦
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
arboard = "3"
enigo = "0.2"
anyhow = "1"

# 只为了给窗口发几条 AppKit 消息（setCollectionBehavior: / setLevel:），
# 让它能盖在别的 App 的全屏窗口上 —— tao 暴露的 API 少一位关键 flag。
# 刻意不用 objc2-app-kit：它的 API 全被 feature flag 门控，直接 msg_send! 只依赖
# selector 名与 ABI，反而更稳。objc2 本来就在依赖树里（tao 拉的），不新增编译量。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
