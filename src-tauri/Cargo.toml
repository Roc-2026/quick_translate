[package]
name = "quicktrans"
version = "0.1.0"
description = "划词翻译 (DeepSeek)"
authors = ["you"]
edition = "2021"

[lib]
name = "quicktrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls：避免在 Windows 上折腾 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
arboard = "3"
enigo = "0.2"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
